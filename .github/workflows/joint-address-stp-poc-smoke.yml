name: Joint address x STP one-seed smoke

on:
  push:
    paths:
      - '.github/workflows/joint-address-stp-poc-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install numpy scipy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run one-seed smoke
        run: |
          python joint_address_stp_poc.py \
            --seeds 1 \
            --shuffles 20 \
            --train-repeats 4 \
            --test-repeats 10 \
            --output /tmp/joint_address_stp_poc_smoke.json \
            | tee /tmp/joint_address_stp_poc_smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: joint-address-stp-poc-smoke
          path: |
            /tmp/joint_address_stp_poc_smoke.json
            /tmp/joint_address_stp_poc_smoke.log
          retention-days: 14

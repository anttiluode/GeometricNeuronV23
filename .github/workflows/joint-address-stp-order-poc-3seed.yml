name: Joint address x STP balanced order POC 3-seed

on:
  push:
    paths:
      - '.github/workflows/joint-address-stp-order-poc-3seed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balanced-order-3seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install numpy scipy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run three independent initializations
        run: |
          python joint_address_stp_order_poc.py \
            --seeds 3 \
            --shuffles 60 \
            --train-repeats 64 \
            --test-repeats 160 \
            --output /tmp/joint_address_stp_order_poc_3seed_result.json \
            | tee /tmp/joint_address_stp_order_poc_3seed.log
      - uses: actions/upload-artifact@v4
        with:
          name: joint-address-stp-balanced-order-poc-3seed
          path: |
            /tmp/joint_address_stp_order_poc_3seed_result.json
            /tmp/joint_address_stp_order_poc_3seed.log
          retention-days: 14

name: Park source-normalized spatial impedance I1

on:
  push:
    paths:
      - '.github/workflows/park-impedance-i1-normalized.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'neuron==8.2.2' numpy scipy matplotlib

      - name: Fetch published Supplementary Software 1
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-025-55819-9/MediaObjects/41467_2025_55819_MOESM7_ESM.zip'
          curl -fL --retry 4 --retry-all-errors "$URL" -o park_software1.zip
          unzip -q park_software1.zip -d park_software1
          MODEL="$PWD/park_software1/Supplementary NEURON models/Conductance-based model"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"

      - name: Compile released mechanisms
        shell: bash
        run: |
          set -euxo pipefail
          cd "$MODEL"
          rm -rf modfiles x86_64
          mkdir modfiles
          cp 'Model Robustness/ChannelsUsed/'*.mod modfiles/
          cp 'Model Robustness/ChannelsUnused/'*.mod modfiles/
          cp 'Model Robustness/ChannelsUsed/'*.inc modfiles/ 2>/dev/null || true
          cp 'Model Robustness/ChannelsUnused/'*.inc modfiles/ 2>/dev/null || true
          rm -f modfiles/cheriff.mod
          nrnivmodl modfiles

      - name: Run source-normalized spatial gate
        shell: bash
        run: |
          set -euxo pipefail
          cd "$MODEL"
          cp 'Model Robustness/parameters_list.py' ./parameters_list.py
          cat > /tmp/park_impedance_i1.py <<'PY'
          import json, os, sys
          import numpy as np
          from neuron import h
          sys.path.insert(0, os.getcwd())
          from FullCA1Model import FullCA1Model
          from parameters_list import setup_parameters

          DT=0.025
          RUN_NR=12
          PRE_OFFSET_MS=1.0
          FREQS=[1.0,10.0,50.0,100.0]
          DISTAL=(490.0,510.0)
          PROXIMAL=(90.0,110.0)
          CONS_SUCCESS=0.80
          CONS_FAILURE=0.20
          AX=('inode','node','axon','hill','iseg')

          Nav_inactivation=[1,0.6,300,100]
          Kdr=[0.04,0.04,0,1]
          tiny=[1e-9,1e-9,550,100]
          CalH=[1e-9,1e-9,300,100]
          Somacar=[1e-9,1e-9,50,30]
          Nap=[1e-9,1e-9,300,100]
          Hcn=[1e-9,1e-9,200,100]
          Km=[1e-9,1e-9,550,100]

          def clean():
              for sec in list(h.allsec()): h.delete_section(sec=sec)

          def build():
              vals=setup_parameters(RUN_NR)
              duration,stim_start,stim_end,Chr,synapses,sim_params,outputs,waveform,waveform_patch,patch_params,Nav,Kad,Kap,Cal,Car=vals
              cp=[Nav,Nav_inactivation,Kap,Kad,Kdr,Chr,tiny,CalH,Cal,Somacar,Nap,tiny,Car,tiny,tiny,Hcn,Km]
              model=FullCA1Model(cp,'Jarsky',100)
              secs=list(h.allsec()); soma_sec=secs[0]; soma=soma_sec(0.5)
              h.distance(0,soma)
              groups={'distal':[],'proximal':[]}
              for sec in secs:
                  if any(x in sec.name().lower() for x in AX): continue
                  for seg in sec:
                      d=float(h.distance(seg)); meta=(sec.name(),float(seg.x),d,sec,seg)
                      if DISTAL[0] <= d <= DISTAL[1]: groups['distal'].append(meta)
                      if PROXIMAL[0] <= d <= PROXIMAL[1]: groups['proximal'].append(meta)
              for g in groups.values(): g.sort(key=lambda z:(z[0],z[1]))
              h.tstop=float(duration); h.dt=DT; h.celsius=35
              times=np.arange(0,h.tstop+h.dt,h.dt)
              wave=np.asarray(waveform,float); n=min(len(times),len(wave)); times=times[:n]; wave=wave[:n]
              model.prepare_simulation(times,np.tile(wave,(len(model.all),1)))
              return model,secs,soma_sec,soma,groups,float(duration)

          def soma_peaks(t,v):
              idx=np.where((v[:-1]<0)&(v[1:]>=0))[0]+1
              keep=[]
              for i in idx:
                  if not keep or t[i]-t[keep[-1]]>1: keep.append(int(i))
              peaks=[]
              for i in keep:
                  lo=max(0,i-int(1/DT)); hi=min(len(t),i+int(5/DT)+1)
                  peaks.append(lo+int(np.argmax(v[lo:hi])))
              return peaks

          # Pass 1: keep I0 labels exactly, from the fixed distal shell.
          clean(); model,secs,soma_sec,soma,groups,duration=build()
          assert groups['distal'], 'empty distal shell'
          assert groups['proximal'], 'empty proximal shell'
          rt=h.Vector(); rt.record(h._ref_t); rs=h.Vector(); rs.record(soma._ref_v)
          dvec=[]
          for *_,seg in groups['distal']:
              q=h.Vector(); q.record(seg._ref_v); dvec.append(q)
          h.finitialize(-73); h.v_init=-73; h.run()
          t=np.asarray(rt); vs=np.asarray(rs); peaks=soma_peaks(t,vs)
          receiver_patterns=[]
          for meta,q in zip(groups['distal'],dvec):
              v=np.asarray(q); patt=[]
              for sp in peaks:
                  lo=max(0,sp-int(1/DT)); hi=min(len(t),sp+int(5/DT)+1)
                  patt.append('S' if float(np.max(v[lo:hi]))>-40 else 'F')
              receiver_patterns.append(''.join(patt))
          fracs=[]; labels=[]
          for e in range(len(peaks)):
              frac=float(np.mean([p[e]=='S' for p in receiver_patterns])); fracs.append(frac)
              labels.append('success' if frac>=CONS_SUCCESS else 'failure' if frac<=CONS_FAILURE else 'mixed')
          event_times=[float(t[p]) for p in peaks]
          print('I1_EVENTS',list(zip(range(1,len(peaks)+1),event_times,fracs,labels)))
          print('GROUP_SIZES', {k:len(v) for k,v in groups.items()})

          # Pass 2: deterministic replay and physical input/transfer impedances.
          clean(); model,secs,soma_sec,soma,groups2,duration=build()
          for name in groups:
              assert [(a,b) for a,b,_,_,_ in groups[name]] == [(a,b) for a,b,_,_,_ in groups2[name]]
          h.finitialize(-73); h.v_init=-73
          imp=h.Impedance(); imp.loc(soma.x,sec=soma_sec)
          measurements=[]
          for ei,(peak_t,frac,label) in enumerate(zip(event_times,fracs,labels),start=1):
              target=max(0.0,peak_t-PRE_OFFSET_MS)
              while h.t + 0.5*DT < target: h.fadvance()
              snapshot_t=float(h.t)

              # History-state summaries at the same physical snapshot.
              state_summary={}
              for gname,items in groups2.items():
                  nav=[]; atype=[]; volt=[]
                  for _,_,_,_,seg in items:
                      volt.append(float(seg.v))
                      if hasattr(seg,'s_na3'): nav.append(float(seg.s_na3))
                      if hasattr(seg,'l_kad'): atype.append(float(seg.l_kad))
                      elif hasattr(seg,'l_kap'): atype.append(float(seg.l_kap))
                  state_summary[gname]=dict(
                      mean_v_mV=float(np.mean(volt)) if volt else None,
                      mean_s_na3=float(np.mean(nav)) if nav else None,
                      mean_l_atype=float(np.mean(atype)) if atype else None)

              for freq in FREQS:
                  for full in (0,1):
                      err=None; groups_out={}; zin=None; zin_phase=None
                      try:
                          imp.compute(freq,full)
                          zin=float(imp.input(soma.x,sec=soma_sec))
                          zin_phase=float(imp.input_phase(soma.x,sec=soma_sec))
                          for gname,items in groups2.items():
                              vals=[]
                              for secname,x,d,sec,seg in items:
                                  amp=float(imp.transfer(seg.x,sec=sec))
                                  phase=float(imp.transfer_phase(seg.x,sec=sec))
                                  vals.append(dict(section=secname,x=x,distance_um=d,amp_MOhm=amp,phase_rad=phase,
                                                   amp_over_soma_input=amp/max(zin,1e-300)))
                              groups_out[gname]=vals
                      except Exception as exc:
                          err=repr(exc)
                      measurements.append(dict(event=ei,label=label,shell_success_fraction=frac,
                          peak_t_ms=peak_t,snapshot_t_ms=snapshot_t,freq_Hz=freq,extended=bool(full),
                          soma_input_MOhm=zin,soma_input_phase_rad=zin_phase,error=err,
                          state_summary=state_summary,groups=groups_out))

          # Predeclared summaries.
          summaries=[]
          for full in (False,True):
              for freq in FREQS:
                  rows=[]
                  for m in measurements:
                      if m['extended']!=full or m['freq_Hz']!=freq or m['error']: continue
                      row=dict(event=m['event'],label=m['label'],frac=m['shell_success_fraction'],zin=m['soma_input_MOhm'])
                      for gname in ('proximal','distal'):
                          a=np.array([r['amp_MOhm'] for r in m['groups'][gname]],float)
                          ar=np.array([r['amp_over_soma_input'] for r in m['groups'][gname]],float)
                          row[f'{gname}_mean_log_amp']=float(np.mean(np.log(np.maximum(a,1e-300))))
                          row[f'{gname}_mean_log_norm']=float(np.mean(np.log(np.maximum(ar,1e-300))))
                      rows.append(row)
                  suc=[r for r in rows if r['label']=='success']; fail=[r for r in rows if r['label']=='failure']
                  s=dict(extended=full,freq_Hz=freq,n_success=len(suc),n_failure=len(fail),n_rows=len(rows))
                  if suc and fail:
                      def ratio(field):
                          d=float(np.mean([r[field] for r in suc])-np.mean([r[field] for r in fail]))
                          return float(np.exp(d))
                      s['soma_input_success_over_failure']=float(np.mean([r['zin'] for r in suc])/np.mean([r['zin'] for r in fail]))
                      s['proximal_raw_success_over_failure']=ratio('proximal_mean_log_amp')
                      s['distal_raw_success_over_failure']=ratio('distal_mean_log_amp')
                      s['proximal_normalized_success_over_failure']=ratio('proximal_mean_log_norm')
                      s['distal_normalized_success_over_failure']=ratio('distal_mean_log_norm')
                      # distal vs proximal difference-of-differences in normalized log transfer
                      ds=np.mean([r['distal_mean_log_norm']-r['proximal_mean_log_norm'] for r in suc])
                      df=np.mean([r['distal_mean_log_norm']-r['proximal_mean_log_norm'] for r in fail])
                      s['distal_specific_success_over_failure']=float(np.exp(ds-df))
                  summaries.append(s)

          # Receiver-wise distal normalized ratios at each frequency for spatial heterogeneity.
          receiver_ratios=[]
          dkeys=[(a,b,d) for a,b,d,_,_ in groups2['distal']]
          for full in (False,True):
              for freq in FREQS:
                  mm=[m for m in measurements if m['extended']==full and m['freq_Hz']==freq and not m['error']]
                  suc=[m for m in mm if m['label']=='success']; fail=[m for m in mm if m['label']=='failure']
                  if not suc or not fail: continue
                  for ri,key in enumerate(dkeys):
                      sl=np.mean([np.log(max(m['groups']['distal'][ri]['amp_over_soma_input'],1e-300)) for m in suc])
                      fl=np.mean([np.log(max(m['groups']['distal'][ri]['amp_over_soma_input'],1e-300)) for m in fail])
                      receiver_ratios.append(dict(extended=full,freq_Hz=freq,section=key[0],x=key[1],distance_um=key[2],
                                                  normalized_success_over_failure=float(np.exp(sl-fl))))

          out=dict(protocol='released run12 widefield',pre_offset_ms=PRE_OFFSET_MS,freqs_Hz=FREQS,
                   distal_shell_um=list(DISTAL),proximal_shell_um=list(PROXIMAL),group_sizes={k:len(v) for k,v in groups2.items()},
                   event_times_ms=event_times,event_shell_success_fraction=fracs,event_labels=labels,
                   measurements=measurements,summaries=summaries,receiver_ratios=receiver_ratios)
          print('=== I1 SUMMARY ===')
          for s in summaries: print('I1_SUMMARY',json.dumps(s,separators=(',',':')))
          for full in (False,True):
              rr=[r['normalized_success_over_failure'] for r in receiver_ratios if r['extended']==full and r['freq_Hz']==1.0]
              if rr: print('I1_DISTAL_RECEIVER_HETEROGENEITY_1HZ',full,min(rr),float(np.median(rr)),max(rr),float(np.std(np.log(rr))))
          with open('/tmp/park_impedance_i1.json','w') as f: json.dump(out,f,indent=2)
          PY
          python /tmp/park_impedance_i1.py | tee /tmp/park_impedance_i1.log

      - name: Upload I1 receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: park-impedance-i1-normalized
          path: |
            /tmp/park_impedance_i1.json
            /tmp/park_impedance_i1.log
          if-no-files-found: error
          retention-days: 14
